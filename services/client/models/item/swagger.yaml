tags:
  - name: item
    description: Item Information
paths:
  /api/item/archive:
    get:
      tags:
        - item
      summary: Download item files as a zip
      description: Streams the given CaskFS download urls as one uncompressed zip
      parameters:
        - name: paths
          in: query
          description: Comma-separated /cask/api/fs/ download urls
          required: true
          schema:
            type: string
        - name: name
          in: query
          description: Zip file name, without extension
          required: false
          schema:
            type: string
      responses:
        '200':
          description: zip archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: missing or non-CaskFS paths
        '404':
          description: a requested file was not found
  /api/item/{itemId}:
    get:
      tags:
        - item
      summary: Get item information by id
      description: Get item information by id
      parameters:
        - name: itemId
          in: path
          description: ID of item
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientMedia:
                    type: object
                    description: Media renditions keyed by gold record @id (node sameAs)
                    additionalProperties:
                      type: object
                      properties:
                        images:
                          type: object
                          description: small, medium, large, tiled, ocr
                        pages:
                          type: array
                          items:
                            type: object
                        download:
                          oneOf:
                            - type: object
                            - type: array
                  displayImage:
                    type: object
                    description: Main image renditions, for search results
                    properties:
                      '@id':
                        type: string
                      images:
                        type: object
                  '@graph':
                    type: array
                    items:
                      type: object
                      properties:
                        fileFormatSimple:
                          type: string
                        filename:
                          type: string
                        fileSize:
                          type: integer
                        '@type':
                          type: array
                          items:
                            type: string
                        sameAs:
                          type: string
                          description: Gold record @id; key into root clientMedia
                        '@id':
                          type: string
                        lastModified:
                          type: string
                          format: date-time
                        fileFormat:
                          type: string
                        identifier:
                          type: array
                          items:
                            type: string
                        image:
                          type: object
                          properties:
                            '@id':
                              type: string
                        license:
                          type: object
                          properties:
                            '@id':
                              type: string
                        material:
                          type: string
                        subjects:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              '@id':
                                type: string
                        name:
                          type: string
                        publisher:
                          type: object
                          properties:
                            name:
                              type: string
                        associatedMedia:
                          type: object
                          properties:
                            '@id':
                              type: string
                        isPartOf:
                          type: array
                          items:
                            type: object
                            properties:
                              '@id':
                                type: string
                  '@id':
                    type: string
    post:
      tags:
        - item
      summary: Search for items by keyword
      description: Search for items by keyword
      parameters:
        - name: itemId
          in: path
          description: ID of item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                textFields:
                  type: array
                  items:
                    type: string
                limit:
                  type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: object
                    properties:
                      value:
                        type: integer
                      relation:
                        type: string
                  offset:
                    type: integer
                  limit:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        "@graph":
                          type: array
                          items:
                            type: object
                            properties:
                              identifier:
                                type: array
                                items:
                                  type: string
                              image:
                                type: object
                                properties:
                                  "@id":
                                    type: string
                              creator:
                                type: object
                                properties:
                                  name:
                                    type: string
                              "@type":
                                type: array
                                items:
                                  type: string
                              subjects:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    "@id":
                                      type: string
                              yearPublished:
                                type: integer
                              associatedMedia:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    "@id":
                                      type: string
                              isPartOf:
                                type: object
                                properties:
                                  "@id":
                                    type: string
                              datePublished:
                                type: string
                              license:
                                type: object
                                properties:
                                  "@id":
                                    type: string
                              name:
                                type: string
                              publisher:
                                type: object
                                properties:
                                  name:
                                    type: string
                              "@id":
                                type: string
                              lastModified:
                                type: string
                        "@id":
                          type: string
                        "_score":
                          type: number
                  aggregations:
                    type: object
                    properties:
                      facets:
                        type: object
                        additionalProperties:
                          type: object
                          additionalProperties:
                            type: integer
                      ranges:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            min:
                              type: integer
                            max:
                              type: integer